name: Golistics
author: ufukty
description: Reports the holistic methods miss struct fields.
branding: { icon: shield, color: orange }
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with: { go-version-file: go.mod, cache: true }
    - { shell: bash, run: go install go.ufukty.com/golistics@v0.2.2 }
    - { shell: bash, run: go vet --vettool="$(which golistics)" ./... }
